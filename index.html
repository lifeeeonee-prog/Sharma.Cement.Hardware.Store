<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharma Cement & Hardware Store</title>
    <!-- Font styling matching the image style -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Courier Prime', monospace;
            background-color: #f7f7f7;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        /* Handwritten business name style */
        h1 {
            font-family: 'Caveat', cursive;
            font-size: 3.5rem;
            margin-bottom: 5px;
            color: #111;
        }
        .tagline {
            font-size: 1.1rem;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }
        /* Decorative dashed divider line */
        .divider {
            border-top: 2px dashed #777;
            margin: 30px auto;
            width: 80%;
        }
        /* Clean clickable quick links */
        .business-link {
            display: block;
            background: white;
            color: #222;
            text-decoration: none;
            padding: 16px;
            margin: 12px 0;
            border-radius: 50px;
            border: 1px dashed #999;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .business-link:hover {
            background: #222;
            color: white;
            border-style: solid;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Title Header -->
        <h1>Sharma Cement & Hardware Store</h1>
        
        <!-- Quick Sub-details -->
        <p class="tagline">📍 Quality Building Materials & Tools</p>
        
        <div class="divider"></div>

        <!-- Call to Action Link Buttons -->
        <!-- REPLACE THE PLACES INSIDE THE THE "href" WITH YOUR ACTUAL LINKS/PHONE NUMBERS -->
        <a class="business-link" href="tel:+911234567890" target="_blank">📞 Call Us: +91 12345 67890</a>
        <a class="business-link" href="https://wa.me/911234567890" target="_blank">💬 Message on WhatsApp</a>
        <a class="business-link" href="https://maps.google.com" target="_blank">🗺️ Find Our Store Location</a>
        
        <div class="divider"></div>

        <!-- Business Description Grid Row -->
        <p><strong>Deals in:</strong> ACC, UltraTech Cement, TMT Steel Bars, Plumbing Items, Paints, and Premium Hand Tools.</p>

        <p class="footer">Open: 9:00 AM — 8:00 PM</p>
    </div>

</body>
</html>

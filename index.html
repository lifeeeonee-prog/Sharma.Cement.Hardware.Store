<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sharma Cement & Hardware Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #F5A800;
      --deep-blue: #1A2B5F;
      --navy: #0D1A3A;
      --white: #FFFFFF;
      --off-white: #F8F6F0;
      --light-gray: #E8E4DC;
      --text-dark: #1C1C1C;
      --text-mid: #444;
      --accent-red: #C0392B;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Barlow', sans-serif;
      color: var(--text-dark);
      background: var(--off-white);
      overflow-x: hidden;
    }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--navy);
      color: rgba(255,255,255,0.85);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 40px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .topbar a { color: var(--gold); text-decoration: none; }
    .topbar span { margin: 0 10px; opacity: 0.4; }

    /* ── NAVBAR ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--deep-blue);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      height: 64px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.4);
    }
    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      color: var(--gold);
      letter-spacing: 0.06em;
      line-height: 1;
    }
    .nav-logo small {
      display: block;
      font-family: 'Barlow', sans-serif;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 400;
    }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--gold); }
    .nav-cta {
      background: var(--gold);
      color: var(--navy);
      padding: 9px 22px;
      border-radius: 3px;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s;
    }
    .nav-cta:hover { background: #FFB800; }

    /* ── HERO SLIDER ── */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 580px;
      overflow: hidden;
    }
    .hero-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1s ease;
    }
    .hero-slide.active { opacity: 1; }
    .hero-slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(13,26,58,0.78) 40%, rgba(13,26,58,0.2));
    }
    /* Fallback gradient backgrounds for slides if images not present */
    .hero-slide:nth-child(1) { background-color: #1a3a5c; }
    .hero-slide:nth-child(2) { background-color: #2c4a1e; }
    .hero-slide:nth-child(3) { background-color: #3a2c1a; }

    .hero-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 80px;
      max-width: 800px;
    }
    .hero-eyebrow {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s 0.3s forwards;
    }
    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 7vw, 6.5rem);
      color: var(--white);
      line-height: 0.95;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s 0.5s forwards;
    }
    .hero-title span { color: var(--gold); }
    .hero-subtitle {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.8);
      line-height: 1.7;
      max-width: 480px;
      margin-bottom: 36px;
      font-weight: 300;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s 0.7s forwards;
    }
    .hero-btns {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s 0.9s forwards;
    }
    .btn-primary {
      background: var(--gold);
      color: var(--navy);
      padding: 14px 32px;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 3px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245,168,0,0.4); }
    .btn-outline {
      border: 2px solid rgba(255,255,255,0.5);
      color: white;
      padding: 14px 32px;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 3px;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-outline:hover { border-color: var(--gold); background: rgba(245,168,0,0.1); }

    /* Slide dots */
    .hero-dots {
      position: absolute;
      bottom: 32px;
      left: 80px;
      z-index: 3;
      display: flex;
      gap: 10px;
    }
    .hero-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    .hero-dot.active { background: var(--gold); transform: scale(1.4); }

    /* Slide counter */
    .hero-counter {
      position: absolute;
      bottom: 30px;
      right: 40px;
      z-index: 3;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.1em;
    }
    .hero-counter strong { color: var(--gold); font-size: 1.2rem; }

    @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

    /* ── STATS BAR ── */
    .stats-bar {
      background: var(--deep-blue);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      padding: 32px 40px;
      gap: 1px;
    }
    .stat-item {
      padding: 20px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .stat-item:last-child { border-right: none; }
    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      color: var(--gold);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 4px;
    }

    /* ── SECTION COMMON ── */
    .section-header {
      text-align: center;
      margin-bottom: 56px;
    }
    .section-tag {
      display: inline-block;
      background: var(--gold);
      color: var(--navy);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 5px 16px;
      margin-bottom: 14px;
    }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.4rem, 4vw, 3.6rem);
      color: var(--deep-blue);
      line-height: 1;
    }
    .section-sub {
      font-size: 1rem;
      color: var(--text-mid);
      margin-top: 12px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.7;
    }
    .divider {
      width: 60px;
      height: 3px;
      background: var(--gold);
      margin: 20px auto 0;
    }

    /* ── MATERIALS ── */
    #materials {
      padding: 96px 40px;
      background: var(--off-white);
    }

    /* CEMENT */
    .cement-section {
      margin-bottom: 96px;
    }
    .cement-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .cement-gallery {
      display: grid;
      grid-template-rows: 1fr 1fr;
      grid-template-columns: 1fr 1fr;
      height: 540px;
    }
    .cement-gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cement-gallery .main-img {
      grid-row: span 2;
    }
    .cement-info {
      background: var(--deep-blue);
      padding: 56px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .cement-info .section-tag { margin-bottom: 20px; }
    .cement-info h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      color: white;
      line-height: 1;
      margin-bottom: 20px;
    }
    .cement-info h3 span { color: var(--gold); }
    .cement-info p {
      color: rgba(255,255,255,0.7);
      line-height: 1.8;
      margin-bottom: 32px;
      font-size: 0.95rem;
    }
    .feature-list { list-style: none; margin-bottom: 36px; }
    .feature-list li {
      color: rgba(255,255,255,0.85);
      font-size: 0.9rem;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .feature-list li::before {
      content: '▶';
      color: var(--gold);
      font-size: 0.6rem;
      flex-shrink: 0;
    }
    .brand-badges { display: flex; gap: 12px; flex-wrap: wrap; }
    .brand-badge {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 8px 20px;
      font-size: 0.8rem;
      font-weight: 700;
